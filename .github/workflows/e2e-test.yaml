name: Run E2E Tests

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      orca_version:
        description: "OrcaSlicer version to test (orcaslicer matrix slot)"
        required: false
        default: "2.5.0"
      bambu_version:
        description: "BambuStudio version to test (bambu-studio matrix slot)"
        required: false
        default: "02.09.01.70"

jobs:
  test:
    name: E2E Test (${{ matrix.slicer.label }})
    runs-on: ubuntu-latest

    # Matrix runs the e2e suite against both supported slicers. Tests that
    # depend on a specific slicer's BBL profile set (e.g. the bundle suite,
    # which feeds an H2D fixture) need the right image — Bambu's set
    # includes H2D, OrcaSlicer 2.3.x's typically doesn't yet. Both jobs
    # build in parallel so PR feedback isn't double-serialised.
    strategy:
      fail-fast: false
      matrix:
        slicer:
          - label: "Orca v${{ inputs.orca_version }}"
            dockerfile: tests/docker/Dockerfile.test
            tag: orca-v${{ inputs.orca_version }}-api-test
            build_arg_name: ORCA_VERSION
            build_arg_value: ${{ inputs.orca_version }}
          - label: "BambuStudio v${{ inputs.bambu_version }}"
            dockerfile: tests/docker/Dockerfile.test.bambu-studio
            tag: bambu-v${{ inputs.bambu_version }}-api-test
            build_arg_name: BAMBU_VERSION
            build_arg_value: ${{ inputs.bambu_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build E2E tests
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.slicer.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.slicer.tag }}
          build-args: |
            ${{ matrix.slicer.build_arg_name }}=${{ matrix.slicer.build_arg_value }}
          cache-from: type=gha,scope=${{ matrix.slicer.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slicer.tag }}

      - name: Run tests
        run: |
          docker run --rm ${{ matrix.slicer.tag }}
